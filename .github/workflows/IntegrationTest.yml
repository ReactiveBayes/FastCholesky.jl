name: Test dependent packages

# Based on https://github.com/ReactiveBayes/Rocket.jl/blob/main/.github/workflows/IntegrationTest.yml
# which is based on https://github.com/SciML/SciMLBase.jl/blob/master/.github/workflows/Downstream.yml

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: ${{ matrix.package.repo }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `[sources]` in `Project.toml` requires Julia 1.11 or newer
        julia-version: ['1']
        os: [ubuntu-latest]
        package:
          # Downstream packages that depend on FastCholesky
          # Each entry runs as a separate parallel job
          - { user: ReactiveBayes, repo: BayesBase.jl }
          - { user: ReactiveBayes, repo: ExponentialFamily.jl }
          - { user: ReactiveBayes, repo: ExponentialFamilyProjection.jl }
          - { user: ReactiveBayes, repo: ReactiveMP.jl }
          - { user: ReactiveBayes, repo: RxInfer.jl }

    steps:
      - uses: actions/checkout@v5

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - name: Clone Downstream
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
          path: downstream

      - name: Point Downstream at this version of FastCholesky
        shell: julia --color=yes {0}
        run: |
          using TOML

          const NAME = "FastCholesky"
          const UUID = "2d5283b6-8564-42b6-bb00-83ed8e915756"

          # We add a `[sources]` entry rather than calling `Pkg.develop`, because `develop`
          # moves the package into `[deps]`. For a downstream that depends on FastCholesky
          # weakly (e.g. BayesBase, via `FastCholeskyExt`) that breaks its `test` target,
          # which may only reference names listed in `[extras]` or `[weakdeps]`.
          projectfile = joinpath("downstream", "Project.toml")
          project = TOML.parsefile(projectfile)

          # `[sources]` is only honoured for a name listed in `[deps]` or `[extras]`,
          # so a purely weak dependency needs an `[extras]` entry adding first
          deps = get(project, "deps", Dict{String, Any}())
          extras = get(project, "extras", Dict{String, Any}())
          if !haskey(deps, NAME) && !haskey(extras, NAME)
              extras[NAME] = UUID
              project["extras"] = extras
          end

          sources = get(project, "sources", Dict{String, Any}())
          sources[NAME] = Dict("path" => abspath("."))
          project["sources"] = sources

          open(projectfile, "w") do io
              TOML.print(io, project; sorted = true)
          end

      - name: Load this and run the downstream tests
        shell: julia --color=yes --project=downstream {0}
        run: |
          using Pkg
          try
              Pkg.update()
              Pkg.test()  # run downstream tests
          catch err
              err isa Pkg.Resolve.ResolverError || rethrow()
              # If resolver fails, assume intentional breaking change (SemVer)
              @info "Not compatible with this release. No problem." exception=err
              exit(0)  # Treat as success
          end
